name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # version tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout (full history: versionCode = commit count)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies/wrapper and validates gradle-wrapper.jar checksums.
      # Cache is written on the default branch and read everywhere else (setup-gradle default).
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace test

      # Fixed debug signing key so every CI build can be installed as an update over the previous one.
      - name: Restore fixed debug keystore
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            ks="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ks"
            chmod 600 "$ks"
            echo "keystore=$ks" >> "$GITHUB_OUTPUT"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set: this debug APK uses a random per-runner key and cannot be installed over a previous CI build (uninstall first). See README → CI/CD."
          fi

      - name: Build debug APK (client-l 1.0.4)
        env:
          ROKIDHA_DEBUG_KEYSTORE_FILE: ${{ steps.debugkey.outputs.keystore }}
          ROKIDHA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ROKIDHA_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ROKIDHA_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleDebug

      - name: Remove debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Report signing certificate
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf "%f\n" | sort -V | tail -1)"
          cert="$("$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          {
            echo "## Debug APK signature"
            echo "Certificate SHA-256: \`$cert\`"
            if [[ "${{ steps.debugkey.outputs.fixed }}" == "true" ]]; then
              echo "Signed with the fixed debug key: installs as an update over earlier CI builds."
            else
              echo "**Random per-runner key** (ANDROID_DEBUG_KEYSTORE_BASE64 not set): uninstall the previous build before installing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Debug certificate SHA-256: $cert"

      - name: Compile check against client-l 1.0.3
        run: ./gradlew --stacktrace :rokid:compileDebugKotlin -Prokid.cxrl.version=1.0.3

      - name: Rename APKs
        id: apk
        run: |
          name="rokid-ha-debug-${GITHUB_SHA::7}.apk"
          glasses="rokid-ha-glasses-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          cp glassesapp/build/outputs/apk/debug/glassesapp-debug.apk "$glasses"
          sha256sum "$name" "$glasses" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "glasses=$glasses" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rokid-ha-debug-apk
          # The phone APK already contains the glasses APK (installed on the glasses from the app);
          # the separate glasses APK is for manual installation via ADB if needed.
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.glasses }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
