name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # version tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies/wrapper and validates gradle-wrapper.jar checksums.
      # Cache is written on the default branch and read everywhere else (setup-gradle default).
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace test

      - name: Build debug APK (client-l 1.0.4)
        run: ./gradlew --stacktrace assembleDebug

      - name: Compile check against client-l 1.0.3
        run: ./gradlew --stacktrace :rokid:compileDebugKotlin -Prokid.cxrl.version=1.0.3

      - name: Rename APK
        id: apk
        run: |
          name="rokid-ha-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rokid-ha-debug-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
