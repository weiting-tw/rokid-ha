name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run: builds the release APK (signed if secrets exist) and uploads it as a
  # workflow artifact. Never creates a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Derive version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix"
              exit 1
            fi
            publish=true
          else
            tag=""
            version="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
            publish=false
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "code=$GITHUB_RUN_NUMBER"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (code $GITHUB_RUN_NUMBER), publish=$publish, prerelease=$prerelease"

      - name: Restore signing keystore from secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            ks="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
            chmod 600 "$ks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$ks" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not configured. Building an UNSIGNED APK; no GitHub Release will be published."
          fi

      - name: Unit tests
        run: ./gradlew --stacktrace test

      - name: Restore fixed debug keystore (signs the bundled glasses app)
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "keystore=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 not set: the bundled glasses app gets a random key and cannot be updated in place on the glasses."
          fi

      - name: Build release APK
        env:
          ROKIDHA_DEBUG_KEYSTORE_FILE: ${{ steps.debugkey.outputs.keystore }}
          ROKIDHA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ROKIDHA_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ROKIDHA_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ROKIDHA_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          ROKIDHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ROKIDHA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ROKIDHA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --stacktrace assembleRelease
          -Prokidha.versionName=${{ steps.v.outputs.version }}
          -Prokidha.versionCode=${{ steps.v.outputs.code }}

      - name: Remove keystores
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/debug.keystore"

      - name: Collect and verify APK
        id: apk
        run: |
          dir=app/build/outputs/apk/release
          ls -la "$dir"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf "%f\n" | sort -V | tail -1)"
          apksigner="$ANDROID_HOME/build-tools/$bt/apksigner"
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            src="$dir/app-release.apk"
            out="rokid-ha-${{ steps.v.outputs.version }}.apk"
            "$apksigner" verify --verbose --print-certs "$src"
          else
            src="$dir/app-release-unsigned.apk"
            out="rokid-ha-${{ steps.v.outputs.version }}-UNSIGNED.apk"
            if "$apksigner" verify "$src" 2>/dev/null; then
              echo "::error::Expected an unsigned APK"; exit 1
            fi
          fi
          cp "$src" "$out"
          glasses="rokid-ha-glasses-${{ steps.v.outputs.version }}.apk"
          cp glassesapp/build/outputs/apk/debug/glassesapp-debug.apk "$glasses"
          sha256sum "$out" "$glasses" | tee "$out.sha256"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "glasses=$glasses" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        id: notes
        run: |
          tag="${{ steps.v.outputs.tag }}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            if [[ -n "$tag" && -f "docs/release-notes/$tag.md" ]]; then
              cat "docs/release-notes/$tag.md"
              echo
            fi
            prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            if [[ -n "$prev" ]]; then
              echo "## Changes since $prev"
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            else
              echo "## Changes"
              git log --no-merges --pretty='- %s (%h)' -n 50
            fi
            echo
            echo "## Verification"
            echo "- Built by GitHub Actions run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA}\`."
            echo "- SHA-256:"
            sed 's/^/  - /' "${{ steps.apk.outputs.name }}.sha256"
            echo "- \`rokid-ha-glasses-*.apk\` is also bundled inside the phone app (Glasses tab → Install glasses app)."
            echo "- Hardware status: see docs/SDK_COMPATIBILITY.md (features not marked VERIFIED are untested on the glasses)."
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rokid-ha-release-${{ steps.v.outputs.version }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.glasses }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.v.outputs.publish == 'true' && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Rokid HA ${{ steps.v.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.glasses }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Explain skipped publication
        if: steps.v.outputs.publish != 'true' || steps.signing.outputs.signed != 'true'
        run: |
          {
            echo "## Release not published"
            if [[ "${{ steps.signing.outputs.signed }}" != "true" ]]; then
              echo "Signing secrets are missing, so the APK is **unsigned** and was only uploaded as a workflow artifact."
              echo "Configure the secrets described in README → CI/CD, then re-run or push a new tag."
            else
              echo "Manual dry run: the signed APK was uploaded as a workflow artifact only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
